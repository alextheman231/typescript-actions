name: Create GitHub Release (Internal)
on:
  push:
    branches: ["main"]

jobs:
  create-github-release:
    permissions:
      contents: write
    uses: alextheman231/github-actions/.github/workflows/create-github-release.yml@760f1347c1597e458ce3e966112d7278ed15c059 # v12.5.1
    secrets:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
