name: Scheduled Patch Release

on:
  workflow_dispatch:
  schedule:
    - cron: 0 21 1 * *

jobs:
  scheduled-patch-release:
    permissions:
      contents: write
    if: ${{ github.repository == 'alextheman231/typescript-actions' }}
    uses: alextheman231/github-actions/.github/workflows/scheduled-patch-release.yml@61154fd335f5a1ff6247cf1a4b8b08688ad4ee34 # v12.7.4
    secrets:
      APP_ID: ${{ vars.ALEX_UP_BOT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ALEX_UP_BOT_PRIVATE_KEY }}
